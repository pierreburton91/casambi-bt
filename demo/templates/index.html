<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Casambi BT Demo</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: Arial, sans-serif; padding: 20px; max-width: 1400px; margin: 0 auto; }
        h1, h2, h3 { margin-bottom: 15px; }
        section { margin-bottom: 30px; padding: 15px; border: 1px solid #ccc; border-radius: 5px; }
        .status { padding: 10px; margin: 10px 0; border-radius: 5px; }
        .status.connected { background: #d4edda; color: #155724; }
        .status.disconnected { background: #f8d7da; color: #721c24; }
        .status.error { background: #fff3cd; color: #856404; }
        button { padding: 8px 16px; margin: 5px; cursor: pointer; }
        input, select { padding: 8px; margin: 5px; min-width: 200px; }
        .units-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 15px; }
        .unit-card { border: 1px solid #ddd; padding: 15px; border-radius: 5px; }
        .unit-card h3 { margin-bottom: 10px; }
        .unit-card .info { margin: 5px 0; }
        .unit-card .info span { display: inline-block; min-width: 120px; }
        .control-group { margin: 8px 0; }
        .control-group label { display: inline-block; width: 120px; }
        .sensor-value { font-weight: bold; }
        .offline { opacity: 0.5; background: #f0f0f0; }
        .online { background: #f0fff0; }
        .log { margin-top: 20px; padding: 10px; background: #f5f5f5; border: 1px solid #ccc; max-height: 200px; overflow-y: auto; }
        .log-entry { margin: 3px 0; font-size: 12px; }
        .log-entry.error { color: red; }
        /* Transport selection styles */
        .transport-buttons { display: flex; gap: 10px; flex-wrap: wrap; margin: 10px 0; }
        .transport-buttons button { flex: 1; min-width: 150px; }
        .transport-config { margin-top: 15px; padding: 10px; background: #f5f5f5; border-radius: 5px; }
        .config-field { margin: 8px 0; }
        .config-field label { display: inline-block; width: 120px; }
        .transport-button { transition: all 0.2s; }
        .transport-button.selected { background: #007bff; color: white; }
        .transport-button:hover:not(:disabled) { background: #0056b3; color: white; }
        .transport-button:disabled { opacity: 0.5; cursor: not-allowed; }
    </style>
</head>
<body>
    <h1>Casambi BT Demo</h1>

    <section id="transport-section">
        <h2>Transport Layer Selection</h2>
        <div id="transport-status" class="status disconnected">Select a transport to begin</div>
        <div id="transport-buttons" class="transport-buttons"></div>
        <div id="transport-config" class="transport-config" style="display: none;">
            <h3>Configuration</h3>
            <div id="config-fields"></div>
            <button id="test-config-btn" style="display: none; margin-top: 10px;">Test Connection</button>
        </div>
    </section>

    <section id="network-section">
        <h2>Network</h2>
        <div id="status" class="status disconnected">Disconnected</div>
        <div>
            <button id="discover-btn">Discover Networks</button>
            <button id="refresh-btn" style="display: none;">Refresh Networks</button>
            <button id="disconnect-btn" style="display: none;">Disconnect</button>
        </div>
        <div>
            <select id="network-select" style="display: none;">
                <option value="">Select a network...</option>
            </select>
            <input type="password" id="password-input" placeholder="Password (optional)" style="display: none;">
            <button id="connect-btn" style="display: none;">Connect</button>
        </div>
        <div id="networks-list"></div>
    </section>

    <section id="units-section" style="display: none;">
        <h2>Units</h2>
        <div class="units-grid" id="units-grid"></div>
    </section>

    <section id="log-section">
        <h2>Log</h2>
        <div class="log" id="log"></div>
    </section>

    <script src="/static/app.js"></script>
</body>
</html>
