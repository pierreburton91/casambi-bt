[metadata]
name = casambi-bt
version = 0.3.2
author = Pierre Burton, based on casambi-bt by Lukas Kempf
description = Casambi Bluetooth library embedded in a Home Assistant integration (modified from casambi-bt by Lukas Kempf)
long_description = file: README.md
long_description_content_type = text/markdown
url = https://github.com/pierreburton91/casambi-bt
classifiers =
    Programming Language :: Python :: 3.12
    License :: OSI Approved :: Apache Software License
    Operating System :: OS Independent
    Development Status :: 4 - Beta

[options]
package_dir =
    = custom_components/casambi_bt
packages = find:
python_requires = >=3.11
install_requires =
    bleak>=2.1.0
    cryptography>=40.0.0
    httpx>=0.25
    bleak_retry_connector >= 3.6.0
    anyio>=4.10.0

[options.extras_require]
esphome = aioesphomeapi>=45.0.0
homeassistant = homeassistant-api>=4.0.0


[options.packages.find]
where = custom_components/casambi_bt
